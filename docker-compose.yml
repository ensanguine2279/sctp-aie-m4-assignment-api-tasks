services:
  # ----------------------------------------------------
  # 1. Dedicated PostgreSQL Database for Task Service
  # ----------------------------------------------------
  task-db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_DB: ${DB_NAME_ENV}
      POSTGRES_USER: ${DB_USER_ENV}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ENV}
    ports:
      - "${DB_HOST_PORT_ENV:-5477}:5432" # Host:Container port mapping
    volumes:
      - task_db_data:/var/lib/postgresql/data # Persistent storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_ENV} -d ${DB_NAME_ENV}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tasks-network

  # ----------------------------------------------------
  # 2. Task Microservice Application
  # ----------------------------------------------------
  task-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ensanguine/task-service:latest
    container_name: task-service
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}" # Ensures the container runs with the same UID and GID as the host user
    ports:
      - "${APP_PORT_ENV:-8077}:${APP_PORT_ENV:-8077}"
    environment:
      - APP_PORT=${APP_PORT_ENV}
      - DB_HOST=${DB_HOST_ENV}
      - DB_PORT=5432
      - DB_NAME=${DB_NAME_ENV}
      - DB_USER=${DB_USER_ENV}
      - DB_PASSWORD=${DB_PASSWORD_ENV}
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key # Path inside the container 
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS_ENV}
      - JWT_ISSUER=${JWT_ISSUER_ENV}
      - JWT_AUDIENCE=${JWT_AUDIENCE_ENV}
    secrets:
      - jwt_public_key
    depends_on:
      task-db:
        condition: service_healthy # Waits for DB healthcheck to pass before booting Spring Boot
    networks:
      - tasks-network

# ----------------------------------------------------
# 3. Secrets Management for JWT Private Key
# ----------------------------------------------------
secrets:
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_PATH:-${HOME}/.taskflow/keys/public.pem}

# ----------------------------------------------------
# 4. Shared Infrastructure (Network & Storage)
# ----------------------------------------------------
networks:
  tasks-network:
    name: tasks-network
    driver: bridge

volumes:
  task_db_data: