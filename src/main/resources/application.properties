spring.application.name=task-service

server.port=${APP_PORT:8077}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow-tasks}
# For WSL use: postgres
# For Mac use: your Mac username
spring.datasource.username=${DB_USER:postgres}
# Leave blank if authentication is set to trust in pg_hba.conf
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Settings
# ⚠️ WARNING: 'create' drops and recreates ALL tables on every startup — all existing data will be lost.
# This is acceptable during early development, but switch to 'update' as soon as you want to keep your data.
spring.jpa.hibernate.ddl-auto=create
# Use this instead when you want to keep existing data:
# spring.jpa.hibernate.ddl-auto=update
# In production, use a migration tool like Flyway or Liquibase instead of ddl-auto.
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT (RS256)
# No default on purpose: a missing key must stop the app at startup.
# Set JWT_PUBLIC_KEY_PATH (e.g. $HOME/.taskflow/keys/public.pem for mvn runs,
# /run/secrets/jwt_public_key under Docker Compose).
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:${user.home}/.taskflow/keys/public.pem}
# The tasks API must be configured with exactly the same issuer and audience.
jwt.issuer=${JWT_ISSUER:user-service}
jwt.audience=${JWT_AUDIENCE:taskflow-api}